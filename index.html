<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AP2 Tagestraining</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AP2 FISI">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-first column; home = streak, today's round, topic picker; play = one task card with typed answers */
:root{
  --paper:#f2f6f7; --surface:#ffffff; --sunk:#e7eef1; --ink:#13202a; --muted:#566874; --line:#d4dee4;
  --accent:#0a6e8a; --accent-ink:#ffffff; --accent-soft:#dcedf3;
  --flame:#c25f0c; --flame-soft:#fbe8d6; --good:#2c7a4c; --good-soft:#dcf0e3; --bad:#b5322f; --bad-soft:#f8e0de;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e151a; --surface:#152028; --sunk:#1c2933; --ink:#e2eaef; --muted:#97a8b4; --line:#27363f;
  --accent:#58b8d8; --accent-ink:#06222c; --accent-soft:#16323d;
  --flame:#f0a35a; --flame-soft:#3a2614; --good:#63c58c; --good-soft:#163323; --bad:#ef7a73; --bad-soft:#3a1a19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e151a; --surface:#152028; --sunk:#1c2933; --ink:#e2eaef; --muted:#97a8b4; --line:#27363f;
  --accent:#58b8d8; --accent-ink:#06222c; --accent-soft:#16323d;
  --flame:#f0a35a; --flame-soft:#3a2614; --good:#63c58c; --good-soft:#163323; --bad:#ef7a73; --bad-soft:#3a1a19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.wrap{max-width:660px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-size:30px;font-weight:800}
.date{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.lvl{text-align:right;flex:none}
.lvl b{display:block;font:700 15px var(--f-mono)}
.lvl span{font-size:12.5px;color:var(--muted)}
.xpbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;width:120px;margin-left:auto}
.xpbar i{display:block;height:100%;background:var(--accent)}
.streak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.flame{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--flame-soft);color:var(--flame);font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.flame.off{background:var(--sunk);color:var(--muted)}
.streak h2{font-size:19px}
.streak p{margin:2px 0 0;color:var(--muted);font-size:14px}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--f-mono);color:var(--muted)}
.day i{width:100%;max-width:40px;height:22px;border-radius:6px;background:var(--sunk);display:block;border:1.5px solid transparent}
.day.done i{background:var(--flame)}
.day.today i{border-color:var(--flame)}
.round{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.round .eyebrow{color:inherit;opacity:.8}
.round h2{font-size:25px}
.round p{margin:0;opacity:.92}
.btn{appearance:none;border:0;cursor:pointer;border-radius:10px;padding:13px 18px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-light{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-good{background:var(--good);color:var(--surface)}
.btn-bad{background:var(--bad);color:var(--surface)}
.btn:hover{filter:brightness(1.06)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:17px}
.small{font-size:13px;color:var(--muted);margin:0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{font:600 11.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cat{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;min-width:0}
.cat input{margin:3px 0 0;accent-color:var(--accent);width:17px;height:17px;flex:none}
.cat b{display:block;font-size:15px;line-height:1.3}
.cat span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.cat:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 6px;cursor:pointer;font-weight:600;font-size:14.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lbl{font-weight:600;font-size:14.5px;margin-bottom:6px;display:block}
.stats{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:8px 12px;align-items:center;font-size:14.5px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.pct{font:500 12.5px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sync{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.warn{color:var(--bad);font-size:13.5px;margin:0}
/* play */
.playhead{display:flex;align-items:center;gap:12px}
.x{background:none;border:1px solid var(--line);border-radius:8px;min-width:38px;height:38px;cursor:pointer;color:var(--muted);flex:none;font-size:14px;padding:0 10px}
.prog{flex:1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font:600 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.tag{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag span{font:600 11.5px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag .t-main{background:var(--flame-soft);color:var(--flame)}
.tag .t-review{background:var(--accent-soft);color:var(--accent)}
.q{font:600 20px/1.35 var(--f-display);margin:0;overflow-wrap:anywhere}
.given{font:500 17px/1.6 var(--f-mono);background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.given-note{font-size:14.5px}
.tblw{overflow-x:auto}
table.gt{border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.gt th,table.gt td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.gt th{font-size:12.5px;color:var(--muted);font-weight:600}
table.gt td{font-family:var(--f-mono);font-size:14px}
table.gt td:first-child{font-family:var(--f-body)}
.fields{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ans{width:100%;min-width:0;font:500 18px var(--f-mono);padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.ans:focus{outline:none;border-color:var(--accent)}
.ans.right{border-color:var(--good);background:var(--good-soft)}
.ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.should{font:600 14.5px var(--f-mono);color:var(--good);margin-top:4px;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 0}
textarea.ans{font:400 16px/1.5 var(--f-body);min-height:84px;resize:vertical}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.card{background:var(--accent-soft)}
.fb b.v{font-family:var(--f-display);font-size:18px}
.fb.ok b.v{color:var(--good)} .fb.no b.v{color:var(--bad)}
.fb p{margin:0}
.expl{font-size:15px}
.expl .tblw{margin-top:8px}
.xpgain{font:700 13px var(--f-mono);color:var(--good)}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font:800 56px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score span{color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.misses{display:flex;flex-direction:column;gap:12px}
.miss{border-left:3px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.miss p{margin:0}
.miss code{font:500 .92em var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.miss .solk{font-weight:600;color:var(--good);font-size:14.5px;overflow-wrap:anywhere}
@media (max-width:420px){.q{font-size:18.5px}.top h1{font-size:26px}.stats{grid-template-columns:minmax(0,1fr) 70px 40px}.cats{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
/* ===== AP2 Tagestraining engine: generators, checking, theory cards ===== */
var ENG = (function(){
/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1))}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function shuffle(r,arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return String(n).replace('.',',')}
function de(n){return n.toLocaleString('de-DE')}
function ip2s(x){x=x>>>0;return[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join('.')}
function s2ip(s){var p=String(s).trim().replace(/,/g,'.').split('.');if(p.length!==4)return null;var v=0;for(var i=0;i<4;i++){if(!/^\d{1,3}$/.test(p[i]))return null;var n=+p[i];if(n>255)return null;v=v*256+n}return v>>>0}
function maskOf(p){return p===0?0:(0xFFFFFFFF<<(32-p))>>>0}
function log2(n){return Math.round(Math.log(n)/Math.LN2)}

/* IPv6 via BigInt */
var B=function(x){return BigInt(x)};
function v6parse(s){
  s=String(s).trim().toLowerCase();
  if(!s||/[^0-9a-f:]/.test(s))return null;
  var dbl=s.split('::');if(dbl.length>2)return null;
  var head=dbl[0]?dbl[0].split(':'):[], tail=dbl.length===2&&dbl[1]?dbl[1].split(':'):[];
  var all=head.concat(tail);
  for(var i=0;i<all.length;i++)if(!/^[0-9a-f]{1,4}$/.test(all[i]))return null;
  var g;
  if(dbl.length===2){var miss=8-all.length;if(miss<1)return null;g=head.concat(Array(miss).fill('0'),tail)}else{if(all.length!==8)return null;g=all}
  return g.map(function(x){return parseInt(x,16)});
}
function g2big(g){var v=B(0);for(var i=0;i<8;i++)v=(v<<B(16))|B(g[i]);return v}
function big2g(v){var g=[];for(var i=7;i>=0;i--)g.push(Number((v>>B(16*i))&B(0xffff)));return g}
function v6mask(g,len){var v=g2big(g), m=len===0?B(0):((B(1)<<B(128))-B(1))^((B(1)<<B(128-len))-B(1));return big2g(v&m)}
function v6short(g){
  var h=g.map(function(x){return x.toString(16)}), bs=-1,bl=0,cs=-1,cl=0;
  for(var i=0;i<8;i++){if(g[i]===0){if(cs<0){cs=i;cl=1}else cl++;if(cl>bl){bl=cl;bs=cs}}else{cs=-1;cl=0}}
  if(bl<2)return h.join(':');
  return h.slice(0,bs).join(':')+'::'+h.slice(bs+bl).join(':');
}
function v6full(g){return g.map(function(x){return('0000'+x.toString(16)).slice(-4)}).join(':')}
function eqG(a,b){if(!a||!b)return false;for(var i=0;i<8;i++)if(a[i]!==b[i])return false;return true}

/* ---------- checking ---------- */
function clean(v){return String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,'')}
function checkField(f,val){
  var v=clean(val), m=f.mode;
  if(!v)return false;
  switch(m){
    case 'ip': return s2ip(v)!==null&&s2ip(v)===s2ip(f.ans);
    case 'cidr': {var a=v.replace(/,/g,'.').split('/'), b=f.ans.split('/');return a.length===2&&s2ip(a[0])!==null&&s2ip(a[0])===s2ip(b[0])&&a[1]===b[1]}
    case 'prefix': return v.replace(/^\//,'')===f.ans;
    case 'num': {var x=v.replace(/\./g,'').replace(/,/g,'.').replace(/[a-zäöüß]+$/,'');return x!==''&&isFinite(+x)&&+x===+f.ans}
    case 'dec': {var y=parseFloat(v.replace(/,/g,'.'));return isFinite(y)&&Math.abs(y-(+f.ans))<=0.011}
    case 'bin': return /^[01]{1,8}$/.test(v)&&parseInt(v,2)===parseInt(f.ans,2);
    case 'hex': {var hx=v.replace(/^0x/,'');return /^[0-9a-f]{1,4}$/.test(hx)&&parseInt(hx,16)===parseInt(f.ans,16)}
    case 'v6short': return v===f.ans;
    case 'v6full': {var parts=v.split(':');return parts.length===8&&parts.every(function(p){return /^[0-9a-f]{4}$/.test(p)})&&eqG(v6parse(v),v6parse(f.ans))}
    case 'v6addr': return eqG(v6parse(v),v6parse(f.ans));
    case 'v6net': {var pa=v.split('/'), pb=f.ans.split('/');if(pa.length!==2||pa[1]!==pb[1])return false;var g=v6parse(pa[0]);return !!g&&eqG(v6mask(g,+pa[1]),v6parse(pb[0]))&&eqG(g,v6mask(g,+pa[1]))}
    case 'iid': {var q=v.split(':');if(q.length!==4||!q.every(function(p){return /^[0-9a-f]{1,4}$/.test(p)}))return false;var t=f.ans.split(':');return q.every(function(p,i){return parseInt(p,16)===parseInt(t[i],16)})}
    case 'text': {var n=v.replace(/[-_.]/g,'');return (f.alias||[f.ans]).some(function(a){return clean(a).replace(/[-_.]/g,'')===n})}
  }
  return false;
}

/* ---------- IPv4 helpers ---------- */
function randNet(r,p){
  var opts=[];
  if(p>=8)opts.push(function(){return ((10<<24)|(ri(r,0,255)<<16)|(ri(r,0,255)<<8)|ri(r,0,255))>>>0});
  if(p>=12)opts.push(function(){return ((172<<24)|(ri(r,16,31)<<16)|(ri(r,0,255)<<8)|ri(r,0,255))>>>0});
  if(p>=16)opts.push(function(){return ((192<<24)|(168<<16)|(ri(r,0,255)<<8)|ri(r,0,255))>>>0});
  return (pick(r,opts)()&maskOf(p))>>>0;
}
function blockExpl(ip,p){
  var oi=Math.floor(p/8), blk=Math.pow(2,8-p%8), m=maskOf(p), oct=(ip>>>(24-8*oi))&255, start=Math.floor(oct/blk)*blk;
  return 'Maske /'+p+' = '+ip2s(m)+'. Rechnen im '+(oi+1)+'. Oktett: Blockgröße 256 − '+(256-blk)+' = '+blk+'. '+oct+' liegt im Block '+start+'–'+(start+blk-1)+'.';
}
function prefixesFor(d){
  var a=[];var lo=d===1?25:d===2?17:9;
  for(var p=lo;p<=30;p++)if(p%8)a.push(p);
  return a;
}

/* ---------- generators ---------- */
var LV=['','Leicht','Mittel','Schwer'];
var DEPTS=['Verwaltung','Produktion','Vertrieb','IT','Lager','Entwicklung','Gäste-WLAN','Server','Buchhaltung','Werkstatt'];
var PORTS=[['SSH',22,'TCP',['ssh']],['HTTPS',443,'TCP',['https']],['HTTP',80,'TCP',['http']],['DNS',53,'UDP/TCP',['dns']],['RDP',3389,'TCP',['rdp','remotedesktop','remote desktop']],['SMTP',25,'TCP',['smtp']],['FTP (Steuerkanal)',21,'TCP',['ftp']],['Telnet',23,'TCP',['telnet']],['NTP',123,'UDP',['ntp']],['SNMP (Abfragen)',161,'UDP',['snmp']],['SNMP-Traps',162,'UDP',['snmptrap','snmptraps','snmp trap','snmp']],['LDAP',389,'TCP',['ldap']],['LDAPS',636,'TCP',['ldaps']],['Kerberos',88,'TCP/UDP',['kerberos']],['SMB',445,'TCP',['smb','cifs']],['Syslog',514,'UDP',['syslog']],['IMAPS',993,'TCP',['imaps']],['IMAP',143,'TCP',['imap']],['POP3',110,'TCP',['pop3','pop']],['MQTT',1883,'TCP',['mqtt']],['MQTT über TLS',8883,'TCP',['mqtts','mqtt tls','mqtt über tls','mqtt']],['DHCP-Server',67,'UDP',['dhcp','dhcpserver','dhcp server','bootps']],['RADIUS (Authentifizierung)',1812,'UDP',['radius']],['SMTP Submission',587,'TCP',['submission','smtp','smtp submission']]];

var GEN={
v4_basic:function(r,d){
  var p=pick(r,prefixesFor(d)), ip=(randNet(r,p)+ri(r,1,Math.pow(2,32-p)-2))>>>0;
  var m=maskOf(p), net=(ip&m)>>>0, bc=(net|(~m>>>0))>>>0, hosts=Math.pow(2,32-p)-2;
  if(((ip>>>0)===net)||ip===bc){ip=(net+1)>>>0}
  var F={net:{label:'Netz-ID',ans:ip2s(net),mode:'ip'},first:{label:'Erster Host',ans:ip2s(net+1),mode:'ip'},last:{label:'Letzter Host',ans:ip2s(bc-1),mode:'ip'},bc:{label:'Broadcast',ans:ip2s(bc),mode:'ip'},hosts:{label:'Nutzbare Hosts',ans:String(hosts),mode:'num'}};
  var keys=d===1?[pick(r,['net','bc','hosts','last'])]:d===2?pick(r,[['net','bc'],['first','last'],['net','hosts'],['bc','last']]):['net','first','last','bc','hosts'];
  return {label:'Adressbereich',q:d===3?'Bestimme den kompletten Adressbereich.':'Bestimme '+keys.map(function(k){return F[k].label}).join(' und ')+'.',given:ip2s(ip)+'/'+p,fields:keys.map(function(k){return F[k]}),

th_sec:[

th_ops:[

th_db:[

<script>
(function(){
document.documentElement.lang='de';
var E=ENG, esc=E.esc;
var LKEY='ap2daily.v2';
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayNum(k){var p=k.split('-');return Math.round(Date.UTC(+p[0],p[1]-1,+p[2])/864e5)}
function keyFromNum(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
var TODAY=dkey(new Date()), TN=dayNum(TODAY), INTERVAL=[0,1,2,4,8,16];
var LEVELS=['Praktikant','Azubi','Helpdesk','Junior-Admin','Admin','Senior-Admin','Netzwerk-Profi','Systemarchitekt','IHK-Legende'];

function fresh(){return {v:2,updated:0,xp:0,streak:0,best:0,lastDone:null,hist:{},cards:{},stats:{},gstats:{},set:{cats:['v4','v6','vlsm'],diff:2,len:10},today:null}}
var S=null;
try{var raw=localStorage.getItem(LKEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||S.v!==2){
  var old=null;try{old=JSON.parse(localStorage.getItem('ap2daily.v1')||'null')}catch(e){}
  S=fresh();
  if(old&&old.v===1){['xp','streak','best','lastDone','hist'].forEach(function(k){if(old[k]!=null)S[k]=old[k]})}
}
var dbDoc=null, syncState='local', saveTimer=null, inClaude=!!(window.claude&&window.claude.use);
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(function(){dbDoc.set({state:JSON.stringify(S),updated:S.updated}).then(function(){syncState='synced';updSync()},function(){syncState='local';updSync()})},1200)}
}
function syncText(){return syncState==='synced'?'Fortschritt wird mit deinem Claude-Konto synchronisiert.':syncState==='loading'?'Synchronisiere …':'Fortschritt ist auf diesem Gerät gespeichert, auch offline.'}
function updSync(){var el=document.getElementById('sync');if(el)el.textContent=syncText()}
function level(){var l=Math.floor(S.xp/300);return {n:l+1,name:LEVELS[Math.min(l,LEVELS.length-1)],into:S.xp%300}}
function streakNow(){return (S.lastDone===TODAY||(S.lastDone&&dayNum(S.lastDone)===TN-1))?S.streak:0}
function acc(st){return st&&st.t?st.ok/st.t:null}

/* ---------- round building ---------- */
function gensFor(cat,d){return (E.CATMAP[cat].gens||[]).filter(function(g){return (E.MIN_D[g]||1)<=d})}
function pickCard(cat,r,used){
  var deck=E.CARDS[cat], due=[], neu=[], rest=[];
  deck.forEach(function(_,i){var k=cat+':'+i;if(used[k])return;var c=S.cards[k];if(!c)neu.push(i);else if(c.due<=TN)due.push(i);else rest.push(i)});
  var i, rev;
  if(due.length){due.sort(function(a,b){return S.cards[cat+':'+a].box-S.cards[cat+':'+b].box});i=due[0];rev=true}
  else if(neu.length){i=E.pick(r,neu);rev=false}
  else if(rest.length){rest.sort(function(a,b){return S.cards[cat+':'+a].due-S.cards[cat+':'+b].due});i=rest[0];rev=true}
  else return null;
  used[cat+':'+i]=1;return E.makeCard(cat,i,rev);
}
function pickDrill(cat,r,d){
  var gs=gensFor(cat,d);
  var w=gs.map(function(g){var a=acc(S.gstats[g]);return a===null?1:1.4-a});
  var tot=w.reduce(function(a,b){return a+b},0), x=r()*tot, i=0;
  while(i<gs.length-1&&x>w[i]){x-=w[i];i++}
  return E.makeDrill(cat,gs[i],r,d);
}
function makeItem(cat,r,used){
  if(E.CATMAP[cat].group==='theory')return pickCard(cat,r,used)||pickCard(cat,r,{});
  return pickDrill(cat,r,S.set.diff);
}
function buildRound(seed,n,mode){
  var r=E.mulberry(E.hashStr(seed)), cats=S.set.cats.slice(), used={};
  var w=cats.map(function(c){var a=acc(S.stats[c]);return (E.CATMAP[c].group==='focus'?1.6:1)*(a===null?1:1.3-a)});
  var slots=[];
  // every chosen topic at least once, the rest weighted towards focus topics and weak spots
  E.shuffle(r,cats).forEach(function(c){if(slots.length<n)slots.push(c)});
  while(slots.length<n){var tot=w.reduce(function(a,b){return a+b},0),x=r()*tot,i=0;while(i<cats.length-1&&x>w[i]){x-=w[i];i++}slots.push(cats[i])}
  slots=E.shuffle(r,slots);
  return {date:TODAY,mode:mode,items:slots.map(function(c){return makeItem(c,r,used)}),idx:0,res:[],given:[],xp:0,done:false,sig:sigOf()};
}
function sigOf(){return S.set.cats.slice().sort().join(',')+'|'+S.set.diff+'|'+S.set.len}

/* ---------- render ---------- */

  var names=S.set.cats.map(function(c){return E.CATMAP[c].name});
  var roundCard;
  if(done){
    var ok=t.res.filter(Boolean).length;
    roundCard='<section class="round"><p class="eyebrow">Tagesrunde erledigt</p><h2>'+ok+' von '+t.items.length+' richtig</h2><p>Morgen gibt es eine neue Runde. Fehler fließen in die Auswahl ein.</p><button class="btn btn-light" id="goFree">Weiter trainieren</button></section>';
  } else {
    roundCard='<section class="round"><p class="eyebrow">Tagesrunde · '+E.LV[S.set.diff]+'</p><h2>'+(started?'Weiter bei Aufgabe '+(t.idx+1)+' von '+t.items.length:S.set.len+' Aufgaben für heute')+'</h2><p>'+esc(names.join(', '))+'</p>'+
      '<button class="btn btn-light" id="goDaily"'+(S.set.cats.length?'':' disabled')+'>'+(started?'Weitermachen':'Runde starten')+'</button></section>';
  }
  function catBox(c){var on=S.set.cats.indexOf(c.id)>=0;return '<label class="cat'+(c.group==='focus'?' focus':'')+'"><input type="checkbox" data-cat="'+c.id+'" id="cat-'+c.id+'"'+(on?' checked':'')+'><span><b>'+esc(c.name)+'</b><span>'+esc(c.desc)+'</span></span></label>'}
  var groups=[['focus','Schwerpunkt'],['more','Weitere Rechenthemen'],['theory','Theorie-Karteikarten (selbst bewerten)']].map(function(g){
    return '<div class="grp"><span class="grp-h">'+g[1]+'</span><div class="cats">'+E.CATS.filter(function(c){return c.group===g[0]}).map(catBox).join('')+'</div></div>'}).join('');
  var seg=[1,2,3].map(function(d){return '<button data-diff="'+d+'" aria-pressed="'+(S.set.diff===d)+'">'+E.LV[d]+'</button>'}).join('');
  var lens=[5,10,15].map(function(n){return '<button data-len="'+n+'" aria-pressed="'+(S.set.len===n)+'">'+n+' Aufgaben</button>'}).join('');
  var diffInfo={1:'Subnetting im 4. Oktett, einzelne Felder, kurze VLSM-Pläne.',2:'Präfixe /17 bis /30, zwei Felder pro Aufgabe, EUI-64, Summenrouten.',3:'Alle Präfixe, komplette Adressbereiche und VLSM-Tabellen wie in der Prüfung.'}[S.set.diff];
  var rows='';
  S.set.cats.forEach(function(c){var a=acc(S.stats[c]), p=a===null?0:Math.round(a*100);rows+='<span>'+esc(E.CATMAP[c].name)+'</span><span class="meter"><i style="width:'+p+'%"></i></span><span class="pct">'+(a===null?'–':p+' %')+'</span>'});
  app.innerHTML=
   '<header class="top"><div><p class="eyebrow">AP Teil 2 · FISI</p><h1>Tagestraining</h1><p class="date">'+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+'</p></div>'+
   '<div class="lvl"><b>Lvl '+L.n+'</b><span>'+L.name+' · '+S.xp+' XP</span><div class="xpbar"><i style="width:'+(L.into/300*100)+'%"></i></div></div></header>'+
   '<section class="streak"><div class="flame'+(sn?'':' off')+'">'+sn+'</div><div><h2>'+(sn===1?'1 Tag in Folge':sn+' Tage in Folge')+'</h2><p>'+(done?'Heute erledigt.':sn?'Spiel heute, sonst reißt die Serie.':'Starte heute eine neue Serie.')+' Rekord: '+S.best+'</p></div><div class="week">'+week+'</div></section>'+
   roundCard+
   '<section class="panel"><h3>Was willst du üben?</h3>'+groups+(S.set.cats.length?'':'<p class="warn">Wähle mindestens ein Thema.</p>')+
   '<div><span class="lbl">Schwierigkeit</span><div class="seg">'+seg+'</div><p class="small" style="margin-top:6px">'+diffInfo+'</p></div>'+
   '<div><span class="lbl">Länge der Tagesrunde</span><div class="seg">'+lens+'</div></div>'+
   (started?'<p class="small">Änderungen gelten ab der nächsten Runde. Die angefangene Runde läuft weiter.</p>':'')+'</section>'+
   (rows?'<section class="panel"><h3>Trefferquote</h3><div class="stats">'+rows+'</div><p class="small">Schwache Themen und Aufgabentypen kommen häufiger dran. Theoriekarten kommen nach der Lernkartei wieder: gewusst nach 1, 2, 4, 8, 16 Tagen, nicht gewusst am nächsten Tag.</p></section>':'')+
   '<div class="row"><button class="btn btn-ghost" id="goFree2"'+(S.set.cats.length?'':' disabled')+'>Freies Training ohne Ende</button>'+(inClaude?'':'<a class="btn btn-ghost" href="lernpfad.html#start">Lernpfad öffnen</a>')+'</div>'+
   '<p class="sync" id="sync">'+syncText()+'</p>';
  app.querySelectorAll('[data-cat]').forEach(function(cb){cb.onchange=function(){var id=cb.dataset.cat,i=S.set.cats.indexOf(id);if(cb.checked&&i<0)S.set.cats.push(id);if(!cb.checked&&i>=0)S.set.cats.splice(i,1);settingsChanged()}});
  app.querySelectorAll('[data-diff]').forEach(function(b){b.onclick=function(){S.set.diff=+b.dataset.diff;settingsChanged()}});
  app.querySelectorAll('[data-len]').forEach(function(b){b.onclick=function(){S.set.len=+b.dataset.len;settingsChanged()}});
  var g=document.getElementById('goDaily');if(g)g.onclick=startDaily;
  ['goFree','goFree2'].forEach(function(id){var b=document.getElementById(id);if(b)b.onclick=startFree});
}
function settingsChanged(){
  var t=S.today;
  if(t&&t.date===TODAY&&!t.done&&t.idx===0&&!t.res.length)S.today=null; // not started yet: rebuild with new choice
  save();var y=window.scrollY;renderHome();window.scrollTo(0,y);
}
function startDaily(){
  if(!S.set.cats.length)return;
  if(!S.today||S.today.date!==TODAY)S.today=buildRound('d'+TODAY+sigOf(),S.set.len,'daily');
  save();cur=S.today;view='play';st=null;render();window.scrollTo(0,0);
}
function startFree(){
  if(!S.set.cats.length)return;
  cur={date:TODAY,mode:'free',items:[],idx:0,res:[],given:[],xp:0,done:false,seed:Date.now()};
  addFree();view='play';st=null;render();window.scrollTo(0,0);
}
function addFree(){var r=E.mulberry(E.hashStr('f'+cur.seed+':'+cur.items.length));var w=S.set.cats;cur.items.push(makeItem(E.pick(r,w),r,{}))}

function placeholder(f){return f.ph||{ip:'z. B. 192.168.1.0',cidr:'z. B. 192.168.1.0/26',num:'Zahl',dec:'Zahl',v6addr:'2001:db8::1',v6short:'gekürzte Adresse'}[f.mode]||''}
function inputMode(f){return ({ip:'decimal',num:'numeric',prefix:'numeric',bin:'numeric',dec:'decimal'})[f.mode]||'text'}

function renderPlay(){
  var it=cur.items[cur.idx], n=cur.items.length, free=cur.mode==='free';
  if(!st)st={checked:false,vals:[],ok:[],revealed:false};
  var c=E.CATMAP[it.cat];
  var tag='<div class="tag"><span class="'+(c.group==='theory'?'t-review':'t-main')+'">'+esc(c.name)+'</span>'+(it.kind==='drill'?'<span>'+esc(it.label)+'</span><span>'+E.LV[it.d]+'</span>':'<span>'+(it.review?'Wiederholung':'Neu')+'</span>')+'</div>';
  var body='', fb='';
  if(it.kind==='drill'){
    var given=it.givenHtml||(it.given?'<div class="given">'+esc(it.given)+'</div>':'');
    var fields=it.fields.map(function(f,i){
      var cls=st.checked?(st.ok[i]?' right':' wrong'):'';
      var ip=f.mode==='ip'||f.mode==='cidr';
      return '<div class="field"><label for="f'+i+'">'+esc(f.label)+'</label><input class="ans'+cls+'" id="f'+i+'" data-i="'+i+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="'+inputMode(f)+'" placeholder="'+esc(placeholder(f))+'" value="'+esc(st.vals[i]||'')+'"'+(st.checked?' disabled':'')+'>'+
        (st.checked&&!st.ok[i]?'<div class="should">'+esc(f.ans)+'</div>':'')+'</div>';
    }).join('');
    var hasIp=it.fields.some(function(f){return f.mode==='ip'||f.mode==='cidr'});
    body=given+'<form class="fields" id="af" novalidate>'+fields+(st.checked?'':'<button class="btn btn-main" type="submit">Prüfen</button>')+'</form>'+(hasIp&&!st.checked?'<p class="hint">Komma statt Punkt geht auch. Enter springt ins nächste Feld.</p>':'');
    if(st.checked){
      var all=st.ok.every(Boolean), part=st.ok.filter(Boolean).length;
      fb='<div class="fb '+(all?'ok':'no')+'"><b class="v">'+(all?'Richtig':it.fields.length>1?part+' von '+it.fields.length+' Feldern richtig':'Nicht ganz')+'</b><div class="expl">'+it.e+'</div>'+(st.xp?'<span class="xpgain">+'+st.xp+' XP</span>':'')+'</div>'+
        '<button class="btn btn-main" id="next">'+(free||cur.idx+1<n?'Weiter':'Ergebnis ansehen')+'</button>';
    }
  } else {
    body='<div class="field"><label for="note">Deine Antwort (optional, nur für dich)</label><textarea class="ans" id="note" placeholder="Erst selbst überlegen, dann aufdecken"'+(st.revealed?' disabled':'')+'>'+esc(st.note||'')+'</textarea></div>';
    if(!st.revealed)body+='<button class="btn btn-main" id="reveal">Lösung zeigen</button>';
    else fb='<div class="fb card"><p class="expl"><b>Lösung:</b> '+esc(it.a)+'</p></div><p class="small">Ehrlich bewerten: Hättest du das so in der Prüfung hingeschrieben?</p><div class="row"><button class="btn btn-bad" id="r0">Nicht gewusst</button><button class="btn btn-good" id="r1">Gewusst</button></div>';
  }
  var head=free?'<div class="playhead"><button class="x" id="quit">Beenden</button><div class="prog"><i style="width:100%"></i></div><span class="count">'+cur.res.filter(Boolean).length+'/'+cur.res.length+'</span></div>'
    :'<div class="playhead"><button class="x" id="quit" aria-label="Pause, zur Übersicht">×</button><div class="prog"><i style="width:'+((cur.idx+(st.checked||st.rated?1:0))/n*100)+'%"></i></div><span class="count">'+(cur.idx+1)+'/'+n+'</span></div>';
  app.innerHTML=head+'<section class="card">'+tag+'<h2 class="q">'+esc(it.q)+'</h2>'+body+fb+'</section>';

  document.getElementById('quit').onclick=function(){if(free&&cur.res.length){view='result';render()}else{view='home';st=null;render()}window.scrollTo(0,0)};
  var form=document.getElementById('af');
  if(form){
    var ins=[].slice.call(form.querySelectorAll('input'));
    ins.forEach(function(inp,i){
      inp.oninput=function(){st.vals[i]=inp.value};
      inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();var nx=ins.slice(i+1).concat(ins.slice(0,i)).filter(function(x){return !x.value.trim()})[0];if(nx&&i<ins.length-1){nx.focus()}else{submit()}}};
    });
    form.onsubmit=function(e){e.preventDefault();submit()};
    if(window.innerWidth>700&&ins[0])ins[0].focus();
  }
  var rv=document.getElementById('reveal');if(rv)rv.onclick=function(){var t=document.getElementById('note');st.note=t?t.value:'';st.revealed=true;render()};
  var r0=document.getElementById('r0'),r1=document.getElementById('r1');if(r0){r0.onclick=function(){rate(false)};r1.onclick=function(){rate(true)}}
  var nx=document.getElementById('next');if(nx){nx.onclick=advance;nx.focus({preventScroll:true})}
}
function bump(key,obj,ok){var s=obj[key]||{t:0,ok:0};s.t++;if(ok)s.ok++;obj[key]=s}
function submit(){
  var it=cur.items[cur.idx];if(st.checked)return;
  it.fields.forEach(function(f,i){var el=document.getElementById('f'+i);st.vals[i]=el?el.value:''});
  if(!st.vals.some(function(v){return v&&v.trim()}))return;
  st.ok=it.fields.map(function(f,i){return E.checkField(f,st.vals[i])});
  var all=st.ok.every(Boolean), part=st.ok.filter(Boolean).length;
  st.xp=all?8+4*it.d+2*(it.fields.length-1):part*2; st.checked=true;
  S.xp+=st.xp;cur.xp+=st.xp;cur.res[cur.idx]=all;cur.given[cur.idx]=st.vals.slice();
  bump(it.cat,S.stats,all);bump(it.gen,S.gstats,all);
  save();render();
}
function rate(ok){
  var it=cur.items[cur.idx],k=it.cat+':'+it.idx,c=S.cards[k]||{box:0,due:TN};
  if(ok){c.box=Math.min(5,c.box+1);c.due=TN+INTERVAL[c.box]}else{c.box=1;c.due=TN+1}
  S.cards[k]=c;st.rated=true;var gain=ok?6:0;S.xp+=gain;cur.xp+=gain;cur.res[cur.idx]=ok;cur.given[cur.idx]=[st.note||''];
  bump(it.cat,S.stats,ok);save();advance();
}
function advance(){
  st=null;
  if(cur.mode==='free'){cur.idx++;addFree();save();render();window.scrollTo(0,0);return}
  if(cur.idx+1<cur.items.length){cur.idx++;save();render();window.scrollTo(0,0);return}
  cur.done=true;S.xp+=25;cur.xp+=25;
  if(S.lastDone!==TODAY){S.streak=(S.lastDone&&dayNum(S.lastDone)===TN-1)?S.streak+1:1;S.lastDone=TODAY;S.best=Math.max(S.best,S.streak)}
  S.hist[TODAY]=cur.res.filter(Boolean).length;
  save();view='result';render();window.scrollTo(0,0);
}
function renderResult(){
  var done=cur.res.length, ok=cur.res.filter(Boolean).length, misses='';
  cur.items.forEach(function(it,i){if(i>=done||cur.res[i])return;
    var right=it.kind==='drill'?it.fields.map(function(f){return (it.fields.length>1?esc(f.label)+': ':'')+'<code>'+esc(f.ans)+'</code>'}).join('<br>'):esc(it.a);
    misses+='<div class="miss"><p>'+esc(it.q)+(it.given?' <code>'+esc(it.given)+'</code>':'')+'</p><p class="solk">'+right+'</p></div>'});
  var free=cur.mode==='free';
  app.innerHTML='<header><p class="eyebrow">'+(free?'Freies Training':'Tagesrunde abgeschlossen')+'</p></header>'+
   '<div class="score"><b>'+ok+'/'+done+'</b><span>richtig</span></div>'+
   '<div class="stats3"><div class="stat"><b>+'+cur.xp+'</b><span>XP'+(free?'':' (inkl. 25 Bonus)')+'</span></div><div class="stat"><b>'+streakNow()+'</b><span>Tage Serie</span></div><div class="stat"><b>Lvl '+level().n+'</b><span>'+level().name+'</span></div></div>'+
   (misses?'<section class="panel"><h3>Nochmal anschauen</h3><div class="misses">'+misses+'</div></section>':'<section class="panel"><h3>Fehlerfrei.</h3><p class="small">Stark. Stell die Schwierigkeit hoch, wenn es zu leicht war.</p></section>')+
   '<div class="row"><button class="btn btn-main" id="home">Zur Übersicht</button><button class="btn btn-ghost" id="more">Weiter trainieren</button></div>';
  document.getElementById('home').onclick=function(){view='home';render();window.scrollTo(0,0)};
  document.getElementById('more').onclick=startFree;
}
render();

/* ---------- optional sync when opened inside Claude ---------- */
(async function(){
  try{
    if(!inClaude)return;
    var db=await claude.use('db'), user=await claude.use('user');if(!db||!user)return;
    var id=await user.id();if(!id)return;
    syncState='loading';updSync();
    var ref=db.collection('data/users/'+id).doc('ap2daily2'), snap=await ref.get();dbDoc=ref;
    if(snap.exists&&view==='home'){var rem=null;try{rem=JSON.parse(snap.data().state)}catch(e){}
      if(rem&&rem.v===2&&(rem.updated||0)>(S.updated||0)){S=rem;try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}syncState='synced';render();return}}
    syncState='synced';if(S.updated)save();else updSync();
  }catch(e){dbDoc=null;syncState='local';updSync()}
})();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
</script>
